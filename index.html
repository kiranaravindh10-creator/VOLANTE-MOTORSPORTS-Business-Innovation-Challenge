    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Motion is opt-in: content is fully visible unless JS runs AND the visitor
      // has no reduced-motion preference. If the app never boots, a safety timer
      // removes the class so nothing stays hidden.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches && 'IntersectionObserver' in window) {
            root.classList.add('motion');
            setTimeout(function () {
              if (!window.__tvBooted) root.classList.remove('motion');
            }, 4000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
